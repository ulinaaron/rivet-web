<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rivet has moved</title>
  <meta http-equiv="refresh" content="0;url=https://rivetsoft.github.io/">
  <link rel="canonical" href="https://rivetsoft.github.io/">
  <script>
    (function () {
      var path = location.pathname || "/";
      if (path.indexOf("/rivet-web") === 0) {
        path = path.slice("/rivet-web".length);
      }
      if (!path) path = "/";
      if (path.charAt(0) !== "/") path = "/" + path;
      location.replace("https://rivetsoft.github.io" + path + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>Rivet has moved to <a href="https://rivetsoft.github.io/">https://rivetsoft.github.io/</a>.</p>
</body>
</html>
